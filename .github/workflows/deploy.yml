name: Deploy MkDocs site to GitHub Pages 🚀

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 💾 Cache pip dependencies
        uses: actions/cache@v4
        with:
          key: ${{ github.ref }}-mkdocs-material
          path: .cache
          restore-keys: |
            ${{ github.ref }}-mkdocs-material-

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🖥️ Deploy with mkdocs gh-deploy
        run: mkdocs gh-deploy --force
