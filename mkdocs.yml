site_name: BNurs Year 5 Study Guide 🩺
site_url: https://y5.note.co2fe.eu.org
site_description: >-
  Personal study guide hub for HKUMed Bachelor of Nursing Year 5 courses —
  clinical reasoning, oncology & palliative care, older adults, leadership,
  and evidence-based practice.
site_author: PureCo2Fe
repo_url: https://github.com/PureCo2Fe/BNurs-Y5
repo_name: PureCo2Fe/BNurs-Y5
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2025 PureCo2Fe — made with 💾 and ☕

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.view
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/win11-fluent.css
  - stylesheets/mermaid-lightbox.css

extra_javascript:
  - javascripts/mermaid-lightbox.js

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - 🏠 Home: index.md
  - 🧠 NURS5602 · CRP:
      - nurs5602-clinical-reasoning/index.md
  - 🎗️ NURS5601 · Oncology:
      - nurs5601-oncology-palliative/index.md
  - 👵 NURS5600 · Older Adults:
      - nurs5600-older-adults/index.md
  - 👑 NURS5603 · Leadership:
      - nurs5603-leadership-informatics/index.md
  - 🔬 NURS5607 · EBP:
      - nurs5607-evidence-based-practice/index.md
